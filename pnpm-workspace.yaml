packages:
  - packages/*

# Allow dependency releases to age for seven days before installing them.
minimumReleaseAge: 10080

overrides:
  '@hono/node-server': ^1.19.13
  esbuild: ^0.28.1
  electron-builder-squirrel-windows: 26.15.3
  find-my-way: 9.7.0
  valibot: 1.4.2

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - better-sqlite3
  - electron
  - electron-winstaller
  - esbuild
  - prisma

allowBuilds:
  '@prisma/engines': true
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  prisma: true
