<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="earthBreathGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3b25c;stop-opacity:1" />
      <stop offset="45%" style="stop-color:#7fc3aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c26a4f;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Outer breath circle with earth tones -->
  <circle cx="50" cy="50" r="45" fill="url(#earthBreathGradient)" opacity="0.95"/>

  <!-- Subtle pulse rings -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="white" stroke-width="1.5" opacity="0.25"/>
  <circle cx="50" cy="50" r="25" fill="none" stroke="white" stroke-width="1.5" opacity="0.35"/>

  <!-- Central glow -->
  <circle cx="50" cy="50" r="18" fill="url(#innerGlow)"/>

  <!-- Inner breathing indicator -->
  <circle cx="50" cy="50" r="12" fill="white" opacity="0.5"/>
</svg>
